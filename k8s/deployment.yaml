apiVersion: apps/v1
kind: Deployment
metadata:
  name: myapp 
spec:
  replicas: 2 
  selector:
    matchLabels:
      app: myapp
  template: 
    metadata:
      labels:
        app: myapp
    spec:
      containers:
      - name: myapp 
        image: girraj0021/myapp:6
        ports:
        - containerPort: 80      
